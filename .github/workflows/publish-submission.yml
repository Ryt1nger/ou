name: Publish hackathon submission ZIP

on:
  push:
    branches: [main]
    paths-ignore:
      - "lex_submission.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Package exact submission files
        run: |
          python scripts/package_submission.py
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('lex_submission.zip') as z:
              assert sorted(z.namelist()) == ['engine.py', 'requirements.txt', 'solution.py']
              assert z.testzip() is None
          print('Valid platform upload')
          PY
      - name: Publish downloadable ZIP to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lex_submission.zip
          if git diff --cached --quiet; then
            echo "Submission ZIP unchanged"
          else
            git commit -m "Publish ready-to-upload hackathon ZIP"
            git push origin HEAD:main
          fi
