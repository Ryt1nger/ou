<!doctype html>
<html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LEX — интерактивное демо</title>
<style>
:root{--navy:#111e40;--blue:#315dca;--muted:#77859f;--line:#e4e8f2;--bg:#f5f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172343;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:256px 1fr}.side{background:linear-gradient(170deg,#101c3b,#162c58);color:#fff;padding:26px 16px;display:flex;flex-direction:column}.brand{font-size:30px;letter-spacing:-1px;font-weight:850;margin:0 10px 0}.brand small{display:block;font-size:11px;font-weight:400;letter-spacing:0;color:#9baacd}.brand b{color:#7c96ff}.nav{display:block;width:100%;border:0;border-radius:11px;text-align:left;margin-top:10px;padding:13px 15px;color:#dbe4fa;background:transparent}.nav.selected,.nav:hover{background:#344d85;color:white}.new{margin-top:26px;background:#3b5dab;color:white;text-align:left}.sidefoot{margin-top:auto;padding:16px 10px;color:#adbbd4;font-size:12px;border-top:1px solid #394b6c}.main{min-width:0}.top{height:72px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line)}.top strong{font-size:17px}.demo-pill{background:#ffedca;border:1px solid #f6dca9;color:#80580b;padding:7px 13px;border-radius:20px;font-size:11px;font-weight:700}.content{padding:24px;max-width:1500px;margin:auto}.chat{display:grid;grid-template-columns:minmax(360px,1fr) 340px;gap:20px;min-height:calc(100vh - 121px)}.chatbody{background:white;border:1px solid var(--line);border-radius:18px;min-width:0;display:flex;flex-direction:column;box-shadow:0 5px 22px #233a6707}.chatmessages{padding:28px 34px;flex:1}.hero{background:linear-gradient(120deg,#f5f8ff,#e7eafe);border-radius:18px;padding:46px 36px 42px;position:relative;overflow:hidden}.hero h1{font-size:34px;letter-spacing:-1.25px;line-height:1.13;margin:12px 0 17px}.hero p{max-width:480px;color:#526380;font-size:15px}.hero .orb{position:absolute;right:-48px;top:6px;font-size:130px;opacity:.09;color:#3f5fe1}.eyebrow{font-weight:700;font-size:11px;color:#4562b7;letter-spacing:1px}.quicktitle{margin:28px 0 14px;font-size:18px}.examples{display:grid;grid-template-columns:1fr 1fr;gap:12px}.example{border:1px solid var(--line);border-radius:12px;background:white;text-align:left;padding:17px;color:#253755;min-height:110px}.example:hover{border-color:#637cda;box-shadow:0 7px 20px #263b7420}.example strong{display:block;margin-bottom:8px}.example span{color:#64748f;font-size:12px}.composer{margin:0 25px 25px;border:1px solid #dce2ed;border-radius:12px;padding:10px;display:flex;gap:8px;background:#fff}.composer input{border:0;outline:none;flex:1;min-width:0;padding:10px;font-size:14px}.send{width:41px;height:41px;border:0;border-radius:10px;background:#315dc8;color:#fff;font-size:21px}.evidence{border-radius:18px;border:1px solid var(--line);background:#fff;padding:25px;box-shadow:0 5px 22px #233a6707}.evidence h3{margin:0 0 18px;font-size:18px}.evidence small{color:var(--muted)}.evidence p{color:#66758f}.sourceitem{padding:14px;border:1px solid #dbe2f4;border-radius:11px;margin:12px 0;background:#f7f9ff}.sourceitem b{font-size:13px}.sourceitem small{display:block;margin-top:5px}.quote{background:#edf2ff;border-left:3px solid #406acb;padding:14px;border-radius:8px;margin-top:13px;color:#253957;white-space:pre-wrap}.bubble{padding:16px 19px;border-radius:14px;background:#edf2fb;margin:5px 0 26px 14%;font-size:15px}.answer{border:1px solid #dfe5f2;border-radius:14px;background:#fff;box-shadow:0 3px 18px #1c3d6c09;padding:23px}.answer h3{margin:0 0 17px;color:#173b80}.answer p{font-size:15px;white-space:pre-wrap}.tag{background:#e7f6ef;color:#167a50;border-radius:8px;font-weight:650;font-size:12px;padding:7px 9px;display:inline-block}.docs{background:#fff;border:1px solid var(--line);border-radius:17px;padding:27px;min-height:calc(100vh - 130px)}.docs h1{margin:0 0 6px}.docs p{color:#66758f}.docs input{width:100%;border:1px solid #dfe5ed;border-radius:9px;padding:13px;max-width:600px;margin:10px 0 20px}.docgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.doc{padding:19px;border:1px solid var(--line);background:#f9faff;border-radius:13px;text-align:left;color:#263b62}.doc strong{display:block}.doc small{display:block;color:#7e8ba2;margin-top:4px}.back{background:#f2f5fb;border:1px solid #dce4f0;border-radius:8px;padding:9px 15px;margin-bottom:20px}.paper{white-space:pre-wrap;padding:30px;background:#fcfcff;border:1px solid #e2e7f0;border-radius:10px;max-height:70vh;overflow:auto;font-family:Georgia,serif;line-height:1.7}.muted{color:var(--muted)}@media(max-width:1000px){.chat{grid-template-columns:1fr}.evidence{min-height:180px}.layout{grid-template-columns:210px 1fr}}@media(max-width:660px){.layout{display:block}.side{padding:10px;display:flex;flex-direction:row;gap:8px;align-items:center}.side .brand{font-size:18px;margin:0}.side .brand small,.sidefoot{display:none}.nav{width:auto;margin:0;padding:10px;font-size:12px}.new{margin:0}.top{height:60px;padding:8px}.top strong{font-size:12px}.demo-pill{font-size:9px;padding:6px}.content{padding:8px}.chatmessages{padding:13px}.hero{padding:23px}.hero h1{font-size:26px}.examples,.docgrid{grid-template-columns:1fr}.chat{min-height:70vh}.composer{margin:10px}.docs{padding:15px}}
</style></head><body>
<div class="layout"><aside class="side"><div class="brand">◩ LEX<b>.</b><small>Юридический ИИ-ассистент</small></div><button class="nav new selected" id="new">＋ Новый диалог</button><button class="nav" id="docsnav">▤ База знаний</button><div class="sidefoot">ПСБ · Hack&Change 2026<br/>21 нормативный документ</div></aside>
<div class="main"><header class="top"><strong id="breadcrumb">Рабочая область / Новый диалог</strong><span class="demo-pill">ДЕМО ИНТЕРФЕЙСА · БЕЗ DEEPSEEK</span></header>
<div class="content"><div class="chat" id="chatview"><section class="chatbody"><div class="chatmessages" id="messages"></div><form id="form" class="composer"><input id="question" aria-label="Юридический вопрос" placeholder="Задайте юридический вопрос..."/><button class="send" aria-label="Отправить">➤</button></form></section><aside class="evidence" id="sources"></aside></div><section class="docs" id="docview" style="display:none"><h1>База знаний</h1><p>Договоры, регламенты, нормы законодательства · 21 документ</p><input id="filter" placeholder="Поиск по документам..."/><div id="doccontent"></div></section></div></div></div>
<script>
(function(){
const examples=[
{topic:'Условия договора',q:'Какой срок оплаты по договору ПТ-05/2023 с ООО «Альфа-Трейдинг»?',a:'По договору поставки ПТ-05/2023 с ООО «Альфа-Трейдинг» срок оплаты — 45 календарных дней с даты поставки.',file:'Договор поставки ПТ-05/2023',clause:'п. 4.1',quote:'Покупатель оплачивает товар в течение 45 (сорока пяти) календарных дней с даты поставки.'},
{topic:'Редакции регламента',q:'Нужно ли одобрение генерального директора для договора на 12 млн рублей в августе 2024 года?',a:'Да. В августе 2024 года действовала редакция регламента 2023 года: договоры на сумму свыше 10 млн рублей требовали одобрения генерального директора.',file:'Регламент согласования договоров (ред. 2023)',clause:'п. 2.4',quote:'Договоры на сумму свыше 10 000 000 рублей подлежат одобрению генеральным директором.'},
{topic:'Трудовое право',q:'Какой максимальный срок испытания можно установить главному бухгалтеру?',a:'Главному бухгалтеру можно установить испытательный срок до шести месяцев, если иное не предусмотрено федеральным законом.',file:'Трудовой кодекс РФ',clause:'ст. 70',quote:'Для руководителей организаций, их заместителей, главных бухгалтеров и их заместителей срок испытания может составлять до шести месяцев.'},
{topic:'Комплаенс',q:'Нужно ли проверять иностранного контрагента в мае 2025 года?',a:'Да. В мае 2025 года требуется обязательная санкционная проверка иностранного контрагента согласно письму К-12 и регламенту.',file:'Письмо комплаенс-службы К-12',clause:'письмо от 15.04.2025',quote:'С 21 апреля 2025 года обязательна санкционная проверка иностранных контрагентов.'}
];
const docs=['Договор аренды А-08/2024 — Северный Склад','Договор поставки П-17/2024 — Альфа-Трейд','Договор поставки ПТ-05/2023 — Альфа-Трейдинг','Доп. соглашение №1 к П-17/2024','Регламент согласования договоров (ред. 2023)','Регламент согласования договоров (ред. 2025)','Служебная записка об архиве договоров','Письмо комплаенс-службы К-12','ТК РФ — ст. 70','ТК РФ — ст. 59','ТК РФ — ст. 99','ТК РФ — ст. 152','НК РФ — ст. 112','НК РФ — ст. 114','НК РФ — ст. 145','НК РФ — ст. 164','НК РФ — ст. 224','НК РФ — ст. 284','КоАП РФ — ст. 13.11','152-ФЗ — ст. 9','МРОТ — ст. 1'];
const msg=document.getElementById('messages'),sources=document.getElementById('sources'),chat=document.getElementById('chatview'),dv=document.getElementById('docview'),title=document.getElementById('breadcrumb');
function esc(s){return String(s).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
function showWelcome(){chat.style.display='grid';dv.style.display='none';title.textContent='Рабочая область / Новый диалог';msg.innerHTML='<div class="hero"><div class="eyebrow">ИИ-АССИСТЕНТ ДЛЯ ЮРИСТОВ</div><h1>Юридические ответы.<br/>С опорой на документы.</h1><p>Проверяйте положения договоров, регламентов и нормативных актов вместе с LEX.</p><div class="orb">⚖</div></div><div class="quicktitle">С чего начнём?</div><div class="examples">'+examples.map(function(x,i){return '<button class="example" data-example="'+i+'"><strong>✦ '+esc(x.topic)+'</strong><span>'+esc(x.q)+'</span></button>'}).join('')+'</div>';sources.innerHTML='<h3>Источники</h3><p>Здесь появятся подтверждающие документы и положения. Выберите пример или задайте вопрос.</p>';}
function answer(q){chat.style.display='grid';dv.style.display='none';const d=examples.find(function(e){return q.toLowerCase().includes(e.q.toLowerCase().slice(0,20)) || q.toLowerCase().includes(e.topic.toLowerCase())}) || (q.toLowerCase().includes('испытан')?examples[2]:q.toLowerCase().includes('12 млн')?examples[1]:q.toLowerCase().includes('пт-05')?examples[0]:q.toLowerCase().includes('контрагент')?examples[3]:null);title.textContent='Рабочая область / Чат с LEX';msg.innerHTML='<div class="bubble">'+esc(q)+'</div><div class="answer"><h3>LEX AI</h3><span class="tag">'+(d?'✓ Ответ на основе документов':'ℹ Демонстрационный режим')+'</span><p>'+esc(d?d.a:'Это визуальное демо без подключения DeepSeek. Выберите один из подготовленных примеров или ознакомьтесь с документами. Для произвольных вопросов требуется backend.')+'</p></div>';sources.innerHTML=d?'<h3>Источники <small>1</small></h3><div class="sourceitem"><b>'+esc(d.file)+'</b><small>'+esc(d.clause)+'</small></div><h4>Подтверждающее положение</h4><div class="quote">'+esc(d.quote)+'</div>':'<h3>Источники</h3><p>Для произвольных запросов требуется работающий backend с DeepSeek.</p>';document.getElementById('question').value='';}
function showDocs(filter=''){chat.style.display='none';dv.style.display='block';title.textContent='Рабочая область / База знаний';const names=docs.filter(function(x){return x.toLowerCase().includes(filter.toLowerCase())});document.getElementById('doccontent').innerHTML='<div class="docgrid">'+names.map(function(x){return '<button class="doc" data-doc="'+esc(x)+'"><strong>▤ '+esc(x)+'</strong><small>Документ из базы знаний</small></button>'}).join('')+'</div>';}
document.getElementById('new').onclick=showWelcome;document.getElementById('docsnav').onclick=function(){showDocs()};document.getElementById('filter').oninput=function(e){showDocs(e.target.value);document.getElementById('filter').value=e.target.value;document.getElementById('filter').focus()};
document.getElementById('form').onsubmit=function(e){e.preventDefault();const q=document.getElementById('question').value.trim();if(q)answer(q)};
document.addEventListener('click',function(e){const ex=e.target.closest('[data-example]');if(ex)answer(examples[Number(ex.dataset.example)].q);const doc=e.target.closest('[data-doc]');if(doc){const name=doc.dataset.doc;document.getElementById('doccontent').innerHTML='<button class="back" id="back">← Все документы</button><h2>'+esc(name)+'</h2><div class="paper">Демонстрационный просмотр источника.<br/><br/>Полный текст находится в базе рабочего приложения LEX. Для подробного просмотра пунктов подключите backend.</div>';document.getElementById('back').onclick=function(){showDocs(document.getElementById('filter').value)}}});showWelcome();
})();
</script></body></html>
